spring:
  application:
    name: agendamento-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agendamento}
    username: ${DB_USER:agendamento}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
server:
  error:
    include-message: never
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 3600
springdoc:
  swagger-ui:
    path: /swagger-ui.html
